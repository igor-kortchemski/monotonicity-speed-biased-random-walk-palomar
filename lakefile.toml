name = "lpp_monotonicity"
version = "0.1.0"
defaultTargets = ["LPPMonotonicity", "Challenge", "Solution"]
requiresModuleSystem = true

[leanOptions]
autoImplicit = false
maxSynthPendingDepth = 3
weak.linter.style.native = true
weak.linter.style.maxHeartbeats = true
weak.linter.style.longFile = 1500

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
# Mathlib v4.35.0
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

# The public statement: the model and Theorem 1.1 from the two lemmas of Appendix A.
[[lean_lib]]
name = "LPPMonotonicity"
globs = ["LPPMonotonicity.*"]

# The development behind it.
[[lean_lib]]
name = "LPPMonotonicityProof"
globs = ["LPPMonotonicityProof.*"]

# Comparator interface (Palomar): the Challenge imports only Mathlib; the
# Solution imports the development and never the Challenge.
[[lean_lib]]
name = "Challenge"
globs = ["Challenge"]

[[lean_lib]]
name = "Solution"
globs = ["Solution"]
